build_platform:
  linux_ppc64le: linux_64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
test: native_and_emulated
workflow_settings:
  free_disk_space: 'quick'
  store_build_artifacts: false
  pagefile_size: 16
  build_workspace_dir:
    - platform: [win_64]
      value: C:\\bld\\
  tools_install_dir:
    - platform: [win_64]
      value: C:\\Miniforge
